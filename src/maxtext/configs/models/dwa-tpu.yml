# DWA TPU-optimized — 8x TPU v5 lite
vocab_size: 50257
d_model: 1024
n_heads: 16
n_layers_A: 4
n_layers_B: 4
seq_len: 1024
N: 4096
D: 9216
r: 4
S: 4
d_k: 128
k_max: 8
batch_size: 16
lr: 0.0001
weight_decay: 0.05
warmup_steps: 2500
max_steps: 150000
lr_scheduler: cosine
lr_min_ratio: 0.1
dropout_rate: 0.1
use_rope: true
rope_base: 10000.0
num_kv_heads: 4
window_size: 0
use_flash: true
gamma_init: 0.01
tau_init: 0.0
T_temperature: 1.0
lambda_sharp_init: 0.1
lambda_sharp_phase2_end: 5.0
lambda_sharp_final: 10.0
lambda_util: 0.01
lambda_div: 0.01
lambda_norm: 0.001
lambda_sparse: 0.01
lambda_entropy: 0.01
aux_warmup_steps: 100
soft_top_k: true
soft_top_k_temp: 1.0
retrieval_norm: true
retrieval_norm_scale: 0.5
sigma_anneal: true
sigma_anneal_start: 2.0
sigma_anneal_end: 0.5
sigma_anneal_warmup: 200
beta_util: 0.1
ema_decay: 0.99
phase1_end: 1000
phase2_end: 10000
grad_clip: 1.0
eval_every: 1000
log_every: 100
eval_steps: 50
train_steps: 32
pool_optimizer: "sparse_adam"
pool_lr: 0.0001
pool_beta1: 0.9
pool_beta2: 0.999
pool_eps: 1.0e-8
tokenizer_name: "gpt2"
generate_every: 1000
generate_length: 100
generate_top_k: 50
grad_accum_steps: 1
generate_prompts:
  - "The universe expanded slowly, stretching the fabric of"
  - "Artificial intelligence fundamentally changed how humanity"
datasets:
  - name: "HuggingFaceFW/fineweb-edu"
    subset: "sample-10BT"
    weight: 0.7
  - name: "roneneldan/TinyStories"
    weight: 0.3